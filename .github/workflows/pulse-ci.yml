name: Pulse Consumer CI

on:
  push:
    branches: [ consumer-v1 ]
  pull_request:
    branches: [ consumer-v1 ]

jobs:
  build-and-test:
    name: Pulse Debug — Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Architecture Drift
        run: |
          chmod +x ./scripts/check-architecture-drift.sh
          ./scripts/check-architecture-drift.sh

      - name: Apply Timber tagging fix
        run: git apply patches/signal-gate-pulse-timber-tags.patch
      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Pulse Debug APK
        working-directory: ./android
        run: ./gradlew :app:assemblePulseDebug --stacktrace --parallel

      - name: Run Unit Tests (Pulse)
        working-directory: ./android
        run: |
          ./gradlew :app:testPulseDebugUnitTest \
            --tests com.signalgate.pulse.ui.navigation.NavGraphRoutePolicyTest \
            --no-daemon --stacktrace

      - name: Run Lint Check (Pulse)
        if: always()
        working-directory: ./android
        run: ./gradlew :app:lintPulseDebug --stacktrace

      - name: List build outputs
        if: always()
        run: find android/app/build -maxdepth 5 -type f | sort

      - name: Upload Pulse Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: android/app/build/outputs/apk/**/app-*.apk
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android/app/build/test-results/**
            android/app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
            android/app/build/intermediates/lint_intermediate_text_report/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify build.gradle compose-metrics gate
        run: |
          if ! grep -q 'project.hasProperty("composeCompilerReports")' android/app/build.gradle; then
            echo "::error::compose-metrics gating reverted in app/build.gradle"
            exit 1
          fi

  build-release:
    name: Pulse Release — Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/consumer-v1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Pulse Release APK
        working-directory: ./android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assemblePulseRelease --stacktrace

      - name: Upload Pulse Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: android/app/build/outputs/apk/**/app-pulse-release*.apk
          if-no-files-found: warn
          retention-days: 14
